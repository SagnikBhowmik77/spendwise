# Keeps the free Render API awake so reminders, bill alerts and reports run on time.
# Render's free tier sleeps after 15 idle minutes and gives 750 instance hours a month per workspace, shared by every
# free service there. So this pings only from 05:30 to about 00:20 India time (00:00-18:50 UTC), about 590 hours a
# month, leaving the rest for the other free services. GitHub may run scheduled jobs a few minutes late, and turns
# schedules off in a repo with no activity for 60 days (re-enable it under Actions).
name: Keep the API awake

on:
  schedule:
    - cron: '*/10 0-18 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API health check
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://spendwise-api-ur0f.onrender.com/api/health
