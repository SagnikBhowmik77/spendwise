<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track spending, budgets, bills and investments in rupees. Free and private, in English and Hindi." />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)" />
    <!-- Link previews. __SITE_URL__ is filled in at build time from VITE_SITE_URL (vite.config.js). -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spendwise" />
    <meta property="og:title" content="Spendwise: know where your money goes" />
    <meta property="og:description" content="Track spending, budgets, bills and investments in rupees. Free and private, in English and Hindi." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spendwise logo with the line: Know where your money goes, every month." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Spendwise</title>
    <!-- Applies the saved theme before the first paint, so dark mode never flashes white. -->
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
